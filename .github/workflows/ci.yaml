name: Continuous Integration
permissions: read-all

on:
  pull_request:
    branches:
      - main
      - devs/**

concurrency:
  # yamllint disable-line rule:line-length
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linters:
    timeout-minutes: 5
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python 🔧
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.15.2

      - name: Check workflow files
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      - name: Test 🔍
        run: |
          # nosemgrep: generic.ci.security.use-frozen-lockfile.use-frozen-lockfile-pip
          pip install semgrep yamllint
          # The short minimumReleaseAge for our own first-party deps in
          # renovate.json is deliberate, and the rule's suggested opt-out
          # ("minimumReleaseAge": false) is invalid per the Renovate schema.
          semgrep --config=auto --error \
            --exclude-rule package_managers.renovate.renovate-missing-minimum-release-age.renovate-missing-minimum-release-age
          yamllint .

  autodoc:
    timeout-minutes: 5
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Regenerate documentation
        run: ./generate-doc.sh

      - name: Verify Changed files
        run: |
          if ! git diff --exit-code -- README.md; then
            echo "::error::Action documentation is out of date. Run \`./generate-doc.sh\`"
            exit 1
          fi


  test-scopes:
    timeout-minutes: 5
    runs-on: ubuntu-26.04
    # The steps without a token reach the real Mergify API with the token the
    # CLI gets for the job's ID token.
    permissions:
      contents: read
      id-token: write
    env:
      # zfixtures/mergify.yml makes any change touch `everything`. On a merge
      # queue draft, the CLI reports instead the scopes the queue decided for
      # the batch, none here, plus `merge-queue`.
      DETECTED_SCOPE: ${{ startsWith(github.head_ref, 'mergify/merge-queue/') && 'merge-queue' || 'everything' }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # When Mergify gives the job no token, the scopes upload warns and
      # carries on, so those steps would pass having sent nothing: require
      # the exchange here. A pull request from a fork gets no ID token.
      - name: Require Mergify to give this job a token for its ID token
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          id_token=$(
            curl -sSf -G "$ACTIONS_ID_TOKEN_REQUEST_URL" \
              --data-urlencode audience=https://api.mergify.com \
              -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              | jq -r .value
          )
          echo "::add-mask::$id_token"
          answer=$(
            jq -n --arg id_token "$id_token" '{id_token: $id_token}' \
              | curl -sS --fail-with-body -H "Content-Type: application/json" \
                --data @- https://api.mergify.com/v1/ci/oidc/exchange
          ) || {
            echo "::error::Mergify gave this job no token for its ID token: $answer"
            exit 1
          }

      - name: Trying action scopes-git-refs
        id: scopes-git-refs
        uses: ./
        with:
          action: scopes-git-refs
          mergify_config_path: zfixtures/mergify.yml

      - name: Trying action scopes-upload
        id: scopes-upload
        uses: ./
        with:
          action: scopes-upload
          scopes: scope1,scope2
          mergify_config_path: zfixtures/mergify.yml

      # No scopes input: an all-scopes pull request may carry no concrete
      # scope, exercising the empty-list path.
      - name: Trying action scopes-upload with all_scopes
        id: scopes-upload-all
        uses: ./
        with:
          action: scopes-upload
          all_scopes: true
          mergify_config_path: zfixtures/mergify.yml

      # The uploads above reach the real API whichever route the CLI picks.
      # Against the mock, only the commit route on the pull request's head
      # SHA (the event payload's, not GITHUB_SHA, which is the merge commit)
      # answers: anything else, the CLI's fallback to the deprecated pull
      # request route included, gets a 404 and fails the step.
      - name: Expect the scopes on the pull request head commit
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          docker compose up -d mockServer
          jq -n --arg path "/v1/repos/$REPOSITORY/commits/$HEAD_SHA/scopes" '{
            method: "PUT",
            path: $path,
            headers: {Authorization: ["Bearer fake-valid-token"]},
            body: {
              type: "JSON",
              json: {scopes: ["scope1", "scope2"], all_scopes: false}
            }
          }' > "$RUNNER_TEMP/scopes-request.json"
          jq '{httpRequest: ., httpResponse: {statusCode: 200}}' \
            "$RUNNER_TEMP/scopes-request.json" \
            | curl -sf --retry 10 --retry-all-errors --retry-delay 1 \
              -X PUT http://localhost:1080/mockserver/expectation -d @-

      - name: Trying action scopes-upload on the commit route
        uses: ./
        with:
          action: scopes-upload
          token: fake-valid-token
          scopes: scope1,scope2
          mergify_api_url: http://localhost:1080
          mergify_config_path: zfixtures/mergify.yml

      # The upload is skipped, not failed, when its `if:` does not hold, and
      # the CLI exits 0 when it finds no pull request: require the request.
      - name: Verify the scopes reached the commit route once
        run: |
          jq '{httpRequest: ., times: {atLeast: 1, atMost: 1}}' \
            "$RUNNER_TEMP/scopes-request.json" \
            | curl -sS --fail-with-body \
              -X PUT http://localhost:1080/mockserver/verify -d @-

      # The extra scopes must reach the commit route in the same report as
      # the detected one: the mock answers only that body, so a separate
      # report for either half gets a 404 and fails the step.
      - name: Expect the detected and extra scopes on the pull request head commit
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          jq -n --arg path "/v1/repos/$REPOSITORY/commits/$HEAD_SHA/scopes" \
            --arg detected "$DETECTED_SCOPE" '{
            method: "PUT",
            path: $path,
            headers: {Authorization: ["Bearer fake-valid-token"]},
            body: {
              type: "JSON",
              json: {scopes: [$detected, "lib-a", "lib-b"], all_scopes: false}
            }
          }' > "$RUNNER_TEMP/extra-scopes-request.json"
          jq '{httpRequest: ., httpResponse: {statusCode: 200}}' \
            "$RUNNER_TEMP/extra-scopes-request.json" \
            | curl -sf -X PUT http://localhost:1080/mockserver/expectation -d @-

      # Blank entries and spaces around names are dropped.
      - name: Trying action scopes with extra scopes on the commit route
        uses: ./
        with:
          action: scopes
          token: fake-valid-token
          scopes: " lib-a, ,lib-b "
          mergify_api_url: http://localhost:1080
          mergify_config_path: zfixtures/mergify.yml

      - name: Verify the detected and extra scopes reached the commit route in one report
        run: |
          jq '{httpRequest: ., times: {atLeast: 1, atMost: 1}}' \
            "$RUNNER_TEMP/extra-scopes-request.json" \
            | curl -sS --fail-with-body \
              -X PUT http://localhost:1080/mockserver/verify -d @-

      - name: Trying action scopes
        id: scopes-detection
        uses: ./
        with:
          action: scopes
          mergify_config_path: zfixtures/mergify.yml

      - name: Check scopes
        env:
          SCOPES: ${{ steps.scopes-detection.outputs.scopes }}
          DETECTED: ${{ fromJSON(steps.scopes-detection.outputs.scopes)[env.DETECTED_SCOPE] }}
          DETECTED_BOOL: ${{ fromJSON(steps.scopes-detection.outputs.scopes)[env.DETECTED_SCOPE] == 'true' }}
        run: |
          echo "SCOPES: $SCOPES"
          test "$DETECTED" == "true"
          test "$DETECTED_BOOL" == "true"

      - name: Dump mockserver logs
        if: failure()
        run: docker compose logs mockServer

  # The action hands the CLI no token of its own: the CLI exchanges the job's
  # ID token, and carries on when Mergify gives it none. The mock stands in
  # for GitHub's ID token service as well, so that no real ID token is minted
  # and written to the mock's logs.
  test-id-token:
    timeout-minutes: 5
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      ACTIONS_ID_TOKEN_REQUEST_URL: http://localhost:1080/github-id-token?api-version=2.0
      ACTIONS_ID_TOKEN_REQUEST_TOKEN: fake-request-token
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The mock answers the job's exchanges in turn with a token, a refusal,
      # and the answer of an organization without the exchange. It takes the
      # scopes with the exchanged token or the job's own only.
      - name: Expect three exchanges and two scopes reports
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          docker compose up -d mockServer
          expect() {
            curl -sf --retry 10 --retry-all-errors --retry-delay 1 \
              -X PUT http://localhost:1080/mockserver/expectation -d @-
          }
          # The audience is the Mergify API URL.
          jq -n '{
            httpRequest: {
              method: "GET",
              path: "/github-id-token",
              queryStringParameters: {
                "api-version": ["2.0"],
                audience: ["http://localhost:1080"]
              },
              headers: {Authorization: ["Bearer fake-request-token"]}
            },
            httpResponse: {
              statusCode: 200,
              headers: {"Content-Type": ["application/json"]},
              body: ({value: "fake-id-token"} | tojson)
            }
          }' | expect
          exchange() {
            jq -n --argjson priority "$1" --argjson status "$2" \
              --argjson answer "$3" '{
              httpRequest: {
                method: "POST",
                path: "/v1/ci/oidc/exchange",
                body: {type: "JSON", json: {id_token: "fake-id-token"}}
              },
              httpResponse: {
                statusCode: $status,
                headers: {"Content-Type": ["application/json"]},
                body: ($answer | tojson)
              },
              times: {remainingTimes: 1},
              priority: $priority
            }' | expect
          }
          exchange 2 200 '{"token": "mrt_exchanged", "expires_in": 3600}'
          exchange 1 403 '{
            "detail": "No trust policy of the organization matches the CI job.",
            "error_code": "CI_ID_TOKEN_NO_MATCHING_TRUST_POLICY"
          }'
          exchange 0 403 '{
            "detail": "This organization cannot authenticate its CI jobs with an ID token.",
            "error_code": "CI_ID_TOKEN_EXCHANGE_NOT_ENABLED"
          }'
          for token in mrt_exchanged job-token; do
            jq -n --arg path "/v1/repos/$REPOSITORY/commits/$HEAD_SHA/scopes" \
              --arg token "$token" '{
              method: "PUT",
              path: $path,
              headers: {Authorization: ["Bearer \($token)"]}
            }' > "$RUNNER_TEMP/scopes-$token.json"
            jq '{httpRequest: ., httpResponse: {statusCode: 200}}' \
              "$RUNNER_TEMP/scopes-$token.json" | expect
          done

      - name: Trying action scopes-upload with the job's ID token
        uses: ./
        with:
          action: scopes-upload
          scopes: scope1,scope2
          mergify_api_url: http://localhost:1080
          mergify_config_path: zfixtures/mergify.yml

      # The empty input must not shadow it.
      - name: Trying action scopes with the job's MERGIFY_TOKEN
        uses: ./
        env:
          MERGIFY_TOKEN: job-token
        with:
          action: scopes
          mergify_api_url: http://localhost:1080
          mergify_config_path: zfixtures/mergify.yml

      # A job not granted `id-token: write`: the action warns, the CLI does
      # not run.
      - name: Trying action scopes-upload without an ID token
        uses: ./
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        with:
          action: scopes-upload
          scopes: scope1,scope2
          mergify_api_url: http://localhost:1080
          mergify_config_path: zfixtures/mergify.yml

      - name: Trying action scopes-upload with a refused exchange
        uses: ./
        with:
          action: scopes-upload
          scopes: scope1,scope2
          mergify_api_url: http://localhost:1080
          mergify_config_path: zfixtures/mergify.yml

      - name: Trying action scopes with an exchange Mergify does not offer
        uses: ./
        with:
          action: scopes
          mergify_api_url: http://localhost:1080
          mergify_config_path: zfixtures/mergify.yml

      - name: Verify the exchanges and the reports
        run: |
          set -euo pipefail
          verify() {
            curl -sS --fail-with-body \
              -X PUT http://localhost:1080/mockserver/verify -d @-
          }
          jq -n '{
            httpRequest: {method: "POST", path: "/v1/ci/oidc/exchange"},
            times: {atLeast: 3, atMost: 3}
          }' | verify
          for token in mrt_exchanged job-token; do
            jq '{httpRequest: ., times: {atLeast: 1, atMost: 1}}' \
              "$RUNNER_TEMP/scopes-$token.json" | verify
          done
          if [ -n "${MERGIFY_TOKEN:-}" ]; then
            echo "::error::The action exported MERGIFY_TOKEN to the job"
            exit 1
          fi

      - name: Dump mockserver logs
        if: failure()
        run: docker compose logs mockServer

  test-junit:
    timeout-minutes: 5
    runs-on: ubuntu-26.04
    # The documented way to name a job without the input. The action must
    # not shadow it when job_name is omitted, and job_name must beat it when
    # given; the verify step below checks both.
    env:
      MERGIFY_TEST_JOB_NAME: job-level-env-probe
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare mockserver
        run: |
          docker compose up -d
          sleep 1
          docker compose logs

      - name: Run action
        uses: ./
        with:
          action: junit-process
          token: fake-valid-token
          report_path: zfixtures/*.xml
          mergify_api_url: http://localhost:1080
          mergify_config_path: zfixtures/mergify.yml
          job_name: job-name-input-probe

      # A report path that looks like a CLI option must stay an operand. The
      # pattern needs a leading wildcard: a prefix-anchored one can never
      # expand to a token starting with `-`.
      - name: Prepare option-lookalike report fixture
        run: |
          mkdir -p './--api-url=http:_example.invalid'
          cp zfixtures/junit_example.xml './--api-url=http:_example.invalid/junit_x.xml'

      # No job_name input: the job-level MERGIFY_TEST_JOB_NAME must reach it.
      - name: Run action with an option-lookalike report path
        uses: ./
        with:
          action: junit-process
          token: fake-valid-token
          report_path: "*/junit_x.xml"
          mergify_api_url: http://localhost:1080
          mergify_config_path: zfixtures/mergify.yml

      # The job name has no locally observable effect: it either reaches the
      # upload as the mergify.test.job.name span attribute, or it does
      # nothing at all. The input did nothing from the day it was added until
      # MRGFY-8734, because it was wired to an env var the CLI never reads,
      # and only the uploaded payload tells the two apart. The payload is
      # OTLP protobuf; attribute keys and values are plain UTF-8 inside it,
      # so grepping the decoded bytes is enough. The first upload passed the
      # input under a job-level env var, so finding the input's value proves
      # the input wins; the second passed none, so finding the job-level
      # value proves an omitted input does not shadow it.
      - name: Verify the job name reached each upload
        run: |
          set -euo pipefail
          curl -sf -X PUT \
            "http://localhost:1080/mockserver/retrieve?type=REQUESTS&format=json" \
            -d "{}" > "$RUNNER_TEMP/requests.json"
          bodies=()
          n=0
          for payload in $(jq -r '.[].body.base64Bytes // empty' "$RUNNER_TEMP/requests.json"); do
            n=$((n + 1))
            body="$RUNNER_TEMP/payload-$n.bin"
            printf '%s' "$payload" | base64 -d > "$body"
            if grep -aq "mergify.test.job.name" "$body"; then
              bodies+=("$body")
            fi
          done
          status=0
          for job_name in job-name-input-probe job-level-env-probe; do
            if [ "${#bodies[@]}" -eq 0 ] || ! grep -aql "$job_name" "${bodies[@]}" > /dev/null; then
              echo "::error::$job_name did not reach the upload as mergify.test.job.name"
              status=1
            fi
          done
          exit "$status"

      - name: Run action with error scenario ❌
        id: error500
        continue-on-error: true
        uses: ./
        with:
          action: junit-process
          token: fake-valid-token
          report_path: zfixtures/junit_example.xml
          mergify_api_url: http://localhost:1085
          mergify_config_path: zfixtures/mergify.yml

      - name: Dump mockserver logs
        if: always()
        run: |
          docker compose logs

  test-wait-jobs:
    needs: [test-junit, test-scopes, linters]
    timeout-minutes: 5
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Trying action
        id: scopes-detection
        uses: ./
        with:
          action: wait-jobs
          jobs: ${{ toJSON(needs) }}
          mergify_config_path: zfixtures/mergify.yml

  all-greens:
    if: ${{ !cancelled() }}
    needs:
      - linters
      - autodoc
      - test-scopes
      - test-id-token
      - test-junit
      - test-wait-jobs
    runs-on: ubuntu-26.04
    steps:
      - name: Verify all jobs succeeded
        uses: Mergifyio/gha-mergify-ci@9a7adba0627bb4ff8f170b0e9854171b5b3e6235 # v29
        with:
          action: wait-jobs
          jobs: ${{ toJSON(needs) }}
