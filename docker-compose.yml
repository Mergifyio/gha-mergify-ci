services:
  mockServer:
    image: mockserver/mockserver:9.0.0@sha256:3b9e91077598e2278af1edd5c417813b344212bd267631bb77298193a49981f5
    command: -logLevel DEBUG
    ports:
      - 1080:1080
    environment:
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/fake-ci-issue-api.json
    volumes:
      - type: bind
        source: zfixtures
        target: /config
  mockServerError:
    image: mockserver/mockserver:9.0.0@sha256:3b9e91077598e2278af1edd5c417813b344212bd267631bb77298193a49981f5
    command: -logLevel DEBUG
    ports:
      - 1085:1080
    environment:
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/fake-ci-issue-api-500.json
    volumes:
      - type: bind
        source: zfixtures
        target: /config
