name: gha-mergify-ci
description: The Mergify CI integration with GitHub Actions
author: Mergify
branding:
  icon: at-sign
  color: blue
inputs:
  action:
    description: |
      The Mergify CI action:
      * junit-process: process JUnit XML files with Mergify CI Insights (Upload and Quarantine)
      * scopes: detect and upload pull requests scopes to Mergify Merge Queue
      * scopes-git-refs: return the base/head git references of the pull request in Merge Queue context
      * scopes-upload: upload pull requests scopes to Mergify Merge Queue
      * wait-jobs: wait for specified jobs to complete before proceeding
    # Backward compat
    default: junit-process
  token:
    description: |
      Mergify application key with the `ci` scope. Defaults to the job's
      MERGIFY_TOKEN. Without either, a job granted `id-token: write`
      exchanges its GitHub ID token for a Mergify token, exported as
      MERGIFY_TOKEN for the following steps of the job.
  mergify_api_url:
    description: URL of the Mergify API
    default: https://api.mergify.com
  job_name:
    description: |
      Override the job name, must be used in case of matrix job to avoid
      having the same name for all jobs
  report_path:
    description: Path of the files to upload
  scopes:
    description: |
      Comma separated list of scopes to upload (actions: scopes,
      scopes-upload). With action: scopes, they are added to the scopes
      detected from the changed files and sent in the same report, e.g. the
      scopes your build tool knows on top of the configuration file filters.
  all_scopes:
    description: |
      Declare that the pull request impacts all scopes (actions: scopes,
      scopes-upload). The Merge Queue treats such a pull request as a
      barrier: it conflicts with every scope, so it is never batched or
      merged in parallel with other pull requests. Typical use: a
      build-system or CI configuration change where enumerating every
      impacted scope is brittle.
    default: "false"
  mergify_config_path:
    description: Path to the Mergify configuration file
  base:
    description: |
      Base git reference for scope detection (action: scopes). Overrides the
      automatic push/pull-request detection. Leave unset to auto-detect.
  head:
    description: |
      Head git reference for scope detection (action: scopes). Defaults to
      HEAD. Leave unset to auto-detect.
  test_step_outcome:
    description: |
      Outcome of the test runner step (e.g. steps.<id>.outcome).
      Pass this to detect silent failures where the test runner crashed
      but the JUnit report appears clean.
      Values: 'success', 'failure', 'cancelled', 'skipped', or omit entirely.
      'skipped' is treated the same as omitting this input.
  jobs:
    description: List of jobs to wait for completion
  mergify_cli_version:
    description: |
      Version of mergify-cli to install. Use `latest` to install the latest
      released version without pinning. Leave unset to use the version pinned
      by Mergifyio/setup-cli.
outputs:
  test_results_upload:
    description: |
      Outcome of the JUnit test-results upload to Mergify Test Engine
      (action: junit-process): 'success', 'rejected' (the API refused the
      upload, e.g. a token without CI Insights access — no test data was
      recorded) or 'failed' (transient upload error). Empty when the
      junit-process step did not run or the installed mergify-cli predates
      this output.
    value: ${{ steps.junit-process.outputs.test_results_upload }}
  scopes:
    description: stringified JSON mapping with names of all scopes matching any of the changed files
    value: ${{ steps.scopes-detection.outputs.scopes }}
  base:
    description: The Merge Queue-aware base SHA of the pull request
    value: ${{ steps.git-refs-detection.outputs.base || steps.scopes-detection.outputs.base }}
  head:
    description: The Merge Queue-aware head SHA of the pull request
    value: ${{ steps.git-refs-detection.outputs.head || steps.scopes-detection.outputs.head }}
runs:
  using: composite
  steps:
    - name: Inputs checks
      shell: bash
      if: |
        inputs.action != 'junit-process' &&
        inputs.action != 'scopes' &&
        inputs.action != 'wait-jobs' &&
        inputs.action != 'scopes-git-refs' &&
        inputs.action != 'scopes-upload'
      env:
        ACTION: ${{ inputs.action }}
      run: |
        echo "Unsupported action: $ACTION"
        echo "Valid actions are: junit-process, scopes, scopes-git-refs, scopes-upload, wait-jobs"
        exit 1

    # Install the Mergify CLI through the shared setup-cli action. The version
    # pin lives in Mergifyio/setup-cli (Renovate-managed there), so an unset
    # mergify_cli_version must fall through to setup-cli's own default instead of
    # being forwarded as an empty string, which setup-cli reads as "latest".
    # Hence two variants: forward an explicit value, or call with no version.
    - name: Setup Mergify CLI 🔧
      if: inputs.mergify_cli_version != ''
      uses: Mergifyio/setup-cli@f4029a9e48b04e184138fdb17df2b27eb035d8bf # v1.5.0
      with:
        mergify_cli_version: ${{ inputs.mergify_cli_version }}

    - name: Setup Mergify CLI (pinned default) 🔧
      if: inputs.mergify_cli_version == ''
      uses: Mergifyio/setup-cli@f4029a9e48b04e184138fdb17df2b27eb035d8bf # v1.5.0

    # The token input, else the job's MERGIFY_TOKEN, else the job's GitHub ID
    # token exchanged for a Mergify token, exported as MERGIFY_TOKEN so that
    # the following steps of the job reach Mergify too, whatever client they
    # run. An exchanged token (Mergify prefixes them `mrt_`) expires after an
    # hour: one an earlier step exported is exchanged again, and dropped when
    # that fails. The steps below read the step's output, since a composite's
    # later steps may not see its own GITHUB_ENV writes. Never fails: without
    # a token, they do what they always did without one. Scopes are only
    # sent for a pull request: a push job neither exchanges nor warns.
    - name: Get a Mergify token
      id: mergify-token
      if: |
        inputs.action == 'junit-process' ||
        ((inputs.action == 'scopes' || inputs.action == 'scopes-upload') &&
         github.event.pull_request)
      shell: bash
      env:
        TOKEN_INPUT: ${{ inputs.token }}
        MERGIFY_API_URL: ${{ inputs.mergify_api_url }}
      run: |
        # The runner's `bash -e` would turn any failed command into a failed
        # action.
        set +e -uo pipefail
        body="$RUNNER_TEMP/mergify-id-token-exchange.json"
        trap 'rm -f "$body"' EXIT
        http() {
          curl -sS --connect-timeout 10 --max-time 20 --retry 2 \
            -o "$body" -w "%{http_code}" "$@"
        }
        # -j: no trailing newline, which jq writes as CRLF on Windows.
        field() {
          jq -j "$1" "$body" 2> /dev/null
        }

        # Sets `exchanged`, or warns why there is none. Silent when Mergify
        # does not offer the exchange (a Mergify or an organization without
        # it): the job is then one without a token.
        exchange_id_token() {
          exchanged=
          if ! command -v jq > /dev/null; then
            echo "::warning::jq is not installed, so this job cannot exchange its ID token for a Mergify token"
            return
          fi
          # The audience: the API URL as the CLI defaults and Mergify reads it.
          local api_url=${MERGIFY_API_URL:-https://api.mergify.com}
          while [[ $api_url == */ ]]; do api_url=${api_url%/}; done
          local status id_token error_code detail
          # The request token mints ID tokens until the job ends: it goes
          # through stdin, out of process arguments, as the ID token does.
          status=$(printf 'Authorization: Bearer %s' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            | http -G "$ACTIONS_ID_TOKEN_REQUEST_URL" \
              --data-urlencode "audience=$api_url" -H @-) || status=000
          id_token=$(field '.value // empty')
          if [ "$status" != 200 ] || [ -z "$id_token" ]; then
            echo "::warning::GitHub Actions gave this job no ID token (HTTP $status), so it has no Mergify token"
            return
          fi
          echo "::add-mask::$id_token"
          status=$(printf '{"id_token": "%s"}' "$id_token" \
            | http -H "Content-Type: application/json" --data @- \
              "$api_url/v1/ci/oidc/exchange") || status=000
          if [ "$status" = 200 ]; then
            exchanged=$(field '.token // empty')
            # It goes to GITHUB_ENV, one NAME=value per line.
            if [[ $exchanged =~ ^[A-Za-z0-9._~+/=-]+$ ]]; then
              echo "::add-mask::$exchanged"
              return
            fi
            exchanged=
          fi
          error_code=$(field '.error_code? // empty')
          if [ "$error_code" = CI_ID_TOKEN_EXCHANGE_NOT_ENABLED ] \
            || { [ "$status" = 404 ] && [ -z "$error_code" ]; }; then
            return
          fi
          detail=$(field '.detail? // empty
            | if type == "string" then . else tojson end
            | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A")')
          echo "::warning::Mergify did not exchange this job's ID token for a token (HTTP $status)${detail:+: $detail}"
        }

        token=${TOKEN_INPUT:-${MERGIFY_TOKEN:-}}
        # Only a job granted `id-token: write` can ask for an ID token.
        if [ -z "$TOKEN_INPUT" ] && [[ -z $token || $token == mrt_* ]] \
          && [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] \
          && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
          exchange_id_token
          token=$exchanged
          if [ -n "$token" ]; then
            echo "MERGIFY_TOKEN=$token" >> "$GITHUB_ENV"
          fi
        fi
        echo "token=$token" >> "$GITHUB_OUTPUT"

    # A step-level env entry that evaluates to '' is still exported, and it
    # shadows the caller's job-level or step-level MERGIFY_TEST_JOB_NAME (and
    # anything written to $GITHUB_ENV). Fall back to the caller's value so an
    # omitted job_name input leaves that override intact; the input wins when
    # both are set.
    - shell: bash
      id: junit-process
      if: inputs.action == 'junit-process'
      env:
        MERGIFY_API_URL: ${{ inputs.mergify_api_url }}
        MERGIFY_TOKEN: ${{ steps.mergify-token.outputs.token }}
        MERGIFY_TEST_JOB_NAME: ${{ inputs.job_name || env.MERGIFY_TEST_JOB_NAME }}
        MERGIFY_TEST_EXIT_CODE: >-
          ${{ inputs.test_step_outcome == 'success' && '0'
          || (inputs.test_step_outcome == 'failure'
          || inputs.test_step_outcome == 'cancelled') && '1'
          || '' }}
        FILES: ${{ inputs.report_path }}
      run: |
        set -x -e
        if [ -z "$FILES" ]; then
          echo "::error::report_path is required for action: junit-process"
          exit 1
        fi
        mergify ci junit-process -- "$FILES"

    - name: Detect head sha and base sha
      if: inputs.action == 'scopes-git-refs' || inputs.action == 'scopes-upload'
      id: git-refs-detection
      shell: bash
      env:
        MERGIFY_CONFIG_PATH: ${{ inputs.mergify_config_path }}
      run: mergify ci git-refs

    - name: Detect scopes, head sha and base sha
      if: inputs.action == 'scopes'
      id: scopes-detection
      shell: bash
      env:
        MERGIFY_CONFIG_PATH: ${{ inputs.mergify_config_path }}
        BASE: ${{ inputs.base }}
        HEAD: ${{ inputs.head }}
      run: |
        args=(--write "$RUNNER_TEMP/mergify-scopes.json")
        [ -n "$BASE" ] && args+=(--base "$BASE")
        [ -n "$HEAD" ] && args+=(--head "$HEAD")
        mergify ci scopes "${args[@]}"

    - name: Upload scopes to Mergify API
      shell: bash
      if: github.event.pull_request && inputs.action == 'scopes-upload'
      env:
        MERGIFY_CONFIG_PATH: ${{ inputs.mergify_config_path }}
        SCOPES: ${{ inputs.scopes }}
        BASE: ${{ steps.git-refs-detection.outputs.base }}
        HEAD: ${{ steps.git-refs-detection.outputs.head }}
      run: |
        set -euo pipefail
        FILE="$RUNNER_TEMP/mergify-scopes.json"
        # Convert comma-separated SCOPES into a JSON array, trimming entry
        # whitespace; an empty input yields [] (an all_scopes pull request
        # may carry no concrete scope)
        SCOPES_JSON=$(jq -R -s 'rtrimstr("\n") | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))' <<< "$SCOPES")
        jq -n \
          --arg base "$BASE" \
          --arg head "$HEAD" \
          --argjson scopes "$SCOPES_JSON" \
          '{base_ref: $base, head_ref: $head, scopes: $scopes}' > "$FILE"

        echo "Created scopes file:"
        cat "$FILE"

    - name: Warn if token is unset for scopes upload
      shell: bash
      if: |
        !steps.mergify-token.outputs.token &&
        (inputs.action == 'scopes' || inputs.action == 'scopes-upload') &&
        github.event.pull_request
      run: echo "::warning::Mergify token is not set, scopes will not be sent to Mergify API"

    - name: Upload scopes to Mergify API
      shell: bash
      if: |
        steps.mergify-token.outputs.token &&
        (inputs.action == 'scopes' || inputs.action == 'scopes-upload') &&
        github.event.pull_request
      env:
        MERGIFY_TOKEN: ${{ steps.mergify-token.outputs.token }}
        MERGIFY_API_URL: ${{ inputs.mergify_api_url }}
        MERGIFY_CONFIG_PATH: ${{ inputs.mergify_config_path }}
        ALL_SCOPES: ${{ inputs.all_scopes }}
        ACTION: ${{ inputs.action }}
        SCOPES: ${{ inputs.scopes }}
      run: |
        set -euo pipefail
        args=(--scopes-json "$RUNNER_TEMP/mergify-scopes.json")
        # A report replaces the previous one for the same commit, so the
        # extra scopes of action: scopes go in the detection's report rather
        # than in a report of their own. scopes-upload already wrote SCOPES
        # into the JSON file. The CLI trims each line and skips empty ones.
        if [ "$ACTION" = "scopes" ] && [ -n "$SCOPES" ]; then
          EXTRA="$RUNNER_TEMP/mergify-extra-scopes.txt"
          tr ',' '\n' <<< "$SCOPES" > "$EXTRA"
          args+=(--scopes-file "$EXTRA")
        fi
        if [ "$ALL_SCOPES" = "true" ]; then
          args+=(--all)
        fi
        mergify ci scopes-send "${args[@]}"

    - name: Wait jobs
      if: inputs.action == 'wait-jobs'
      uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
      with:
        allowed-skips: ${{ inputs.jobs }}
        jobs: ${{ inputs.jobs }}
